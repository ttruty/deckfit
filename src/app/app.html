<a class="skip-link" href="#main">Skip to content</a>

@if (!immersive()) {
<mat-toolbar class="top-bar">
  <a class="brand" routerLink="/">DeckFit</a>

  <nav class="top-nav" aria-label="Main">
    @for (item of nav; track item.path) {
      <a mat-button [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{ exact: item.exact }">
        <mat-icon>{{ item.icon }}</mat-icon>{{ item.label }}
      </a>
    }
  </nav>

  <span class="spacer"></span>

  <!-- Cycles System → Light → Dark. A plain button keeps menu/overlay code out of the initial bundle. -->
  @let current = currentTheme();
  <button mat-icon-button (click)="cycleTheme()" [attr.aria-label]="'Theme: ' + current.label + '. Change theme'" [title]="'Theme: ' + current.label">
    <mat-icon>{{ current.icon }}</mat-icon>
  </button>

  <a mat-icon-button routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page"
     aria-label="Settings" title="Settings">
    <mat-icon>settings</mat-icon>
  </a>
</mat-toolbar>
}

<main id="main" class="content" [class.immersive]="immersive()">
  <router-outlet />
</main>

@if (!immersive()) {
<nav class="bottom-nav" aria-label="Main">
  @for (item of nav; track item.path) {
    <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
       [routerLinkActiveOptions]="{ exact: item.exact }">
      <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
  }
</nav>
}
