<a class="skip-link" href="#main">Skip to content</a>

@if (!immersive()) {
  <header class="df-topbar">
    <a class="df-wordmark" routerLink="/">DeckFit</a>

    <nav class="df-topnav" aria-label="Main">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
           [routerLinkActiveOptions]="{ exact: item.exact }">
          <df-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Cycles System → Light → Dark. A plain button keeps menu/overlay code out of the initial bundle. -->
    @let current = currentTheme();
    <button type="button" class="df-icon-btn" (click)="cycleTheme()"
            [attr.aria-label]="'Theme: ' + current.label + '. Change theme'" [title]="'Theme: ' + current.label">
      <df-icon name="theme" />
    </button>

    <a class="df-icon-btn" routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page"
       aria-label="Settings" title="Settings">
      <df-icon name="settings" />
    </a>
  </header>
}

<main id="main" class="content" [class.immersive]="immersive()">
  <router-outlet />
</main>

@if (!immersive()) {
  <nav class="df-bottomnav" aria-label="Main">
    @for (item of nav; track item.path) {
      <a class="df-tab" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{ exact: item.exact }">
        <span class="df-tab__ind"><df-icon [name]="item.icon" /></span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
}
